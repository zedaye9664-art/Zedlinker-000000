service cloud.firestore {
  match /databases/{database}/documents {
    // Public - only approved active links, published blogs, active products, approved active ads, active announcements
    match /links/{id} {
      allow read: if resource.data.status == 'approved' && resource.data.isActive == true;
      allow create: if request.auth != null && request.resource.data.submittedBy == request.auth.uid;
      allow update, delete: if request.auth != null && (request.auth.token.admin == true || resource.data.submittedBy == request.auth.uid && request.resource.data.status == 'pending');
    }
    match /blogs/{id} { allow read: if resource.data.status == 'published'; allow write: if request.auth != null && request.auth.token.admin == true; }
    match /products/{id} { allow read: if resource.data.status == 'active'; allow write: if request.auth != null && request.auth.token.admin == true; }
    match /ads/{id} { allow read: if resource.data.status == 'approved' && resource.data.isActive == true; allow write: if request.auth.token.admin == true; }
    match /categories/{id} { allow read: if true; allow write: if request.auth.token.admin == true; }
    match /plans/{id} { allow read: if true; allow write: if request.auth.token.admin == true; }

    // Private user data - owner only
    match /users/{uid} {
      allow read: if request.auth != null && (request.auth.uid == uid || request.auth.token.admin == true);
      allow write: if request.auth != null && request.auth.uid == uid && !('role' in request.resource.data) && !('walletBalance' in request.resource.data);
    }
    match /wallets/{uid} { allow read: if request.auth.uid == uid || request.auth.token.admin == true; allow write: if false; }
    match /withdrawals/{id} { allow read: if request.auth.uid == resource.data.userId || request.auth.token.admin == true; allow create: if request.auth.uid == request.resource.data.userId; allow update: if request.auth.token.admin == true; }
    
    // Admin only
    match /adminLogs/{id} { allow read, write: if request.auth.token.admin == true; }
    match /{document=**} { allow read, write: if false; }
  }
